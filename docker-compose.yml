services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-protoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protoflow}
      POSTGRES_DB: ${POSTGRES_DB:-protoflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-protoflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-protoflow}:${POSTGRES_PASSWORD:-protoflow}@postgres:5432/${POSTGRES_DB:-protoflow}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      DEV_LLM_PROVIDER: ${DEV_LLM_PROVIDER:-}
      DEV_OPENAI_API_KEY: ${DEV_OPENAI_API_KEY:-}
      DEV_OPENAI_BASE_URL: ${DEV_OPENAI_BASE_URL:-}
      DEV_OPENAI_MODEL: ${DEV_OPENAI_MODEL:-}
      DEV_OLLAMA_API_KEY: ${DEV_OLLAMA_API_KEY:-}
      DEV_OLLAMA_BASE_URL: ${DEV_OLLAMA_BASE_URL:-}
      DEV_OLLAMA_MODEL: ${DEV_OLLAMA_MODEL:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-protoflow}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["sh", "-c", "uv run arq app.workers.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-protoflow}:${POSTGRES_PASSWORD:-protoflow}@postgres:5432/${POSTGRES_DB:-protoflow}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b}
      DEV_LLM_PROVIDER: ${DEV_LLM_PROVIDER:-}
      DEV_OPENAI_API_KEY: ${DEV_OPENAI_API_KEY:-}
      DEV_OPENAI_BASE_URL: ${DEV_OPENAI_BASE_URL:-}
      DEV_OPENAI_MODEL: ${DEV_OPENAI_MODEL:-}
      DEV_OLLAMA_API_KEY: ${DEV_OLLAMA_API_KEY:-}
      DEV_OLLAMA_BASE_URL: ${DEV_OLLAMA_BASE_URL:-}
      DEV_OLLAMA_MODEL: ${DEV_OLLAMA_MODEL:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-protoflow}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
