[project]
name = "protoflow-backend"
version = "0.1.0"
description = "ProtoFlow backend — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.26.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Mock transcript fixtures contain intentionally long noisy-transcript strings.
"app/integrations/meetings/fixtures.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
